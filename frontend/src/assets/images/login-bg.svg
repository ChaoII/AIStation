<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1400 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="AIStation 登录背景">
  <defs>
    <style>
      @media (prefers-color-scheme: dark) {
        #bg-layer { fill: url(#bgDark); }
        #soft-glow { fill: url(#glowDark); }
        .grid-line { stroke: rgba(120, 160, 255, 0.10); }
        .net-line { stroke: rgba(120, 160, 255, 0.22); }
        .net-dot { fill: rgba(150, 190, 255, 0.42); }
        #mesh { fill: url(#meshDark); }
      }
    </style>

    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3f7ff" />
      <stop offset="60%" stop-color="#e3edff" />
      <stop offset="100%" stop-color="#d6e7ff" />
    </linearGradient>

    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1324" />
      <stop offset="60%" stop-color="#162135" />
      <stop offset="100%" stop-color="#1e2c44" />
    </linearGradient>

    <radialGradient id="glowLight" cx="18%" cy="14%" r="62%">
      <stop offset="0%" stop-color="rgba(64,128,255,0.30)" />
      <stop offset="45%" stop-color="rgba(64,128,255,0.14)" />
      <stop offset="100%" stop-color="rgba(64,128,255,0)" />
    </radialGradient>

    <radialGradient id="glowDark" cx="18%" cy="14%" r="62%">
      <stop offset="0%" stop-color="rgba(98,142,255,0.34)" />
      <stop offset="50%" stop-color="rgba(98,142,255,0.15)" />
      <stop offset="100%" stop-color="rgba(98,142,255,0)" />
    </radialGradient>

    <radialGradient id="glowSecondary" cx="82%" cy="78%" r="58%">
      <stop offset="0%" stop-color="rgba(54,207,201,0.22)" />
      <stop offset="50%" stop-color="rgba(54,207,201,0.09)" />
      <stop offset="100%" stop-color="rgba(54,207,201,0)" />
    </radialGradient>

    <linearGradient id="meshLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.55)" />
      <stop offset="40%" stop-color="rgba(255,255,255,0.16)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </linearGradient>
    <linearGradient id="meshDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </linearGradient>

    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path class="grid-line" d="M46 0H0V46" fill="none" stroke="rgba(64,128,255,0.055)" stroke-width="1" />
    </pattern>
  </defs>

  <rect id="bg-layer" width="100%" height="100%" fill="url(#bgLight)" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  <rect id="soft-glow" width="100%" height="100%" fill="url(#glowLight)" />
  <rect width="100%" height="100%" fill="url(#glowSecondary)" />
  <rect id="mesh" width="100%" height="100%" fill="url(#meshLight)" />

  <!-- 左上：小型数据网络 -->
  <g class="net-line" stroke="rgba(64,128,255,0.16)" stroke-width="1.2" fill="none">
    <path d="M110 130 L190 86 L272 158 L214 226 L124 214 L110 130" />
    <path d="M272 158 L344 206 L214 226" />
  </g>
  <g class="net-dot" fill="rgba(64,128,255,0.26)">
    <circle cx="110" cy="130" r="4" />
    <circle cx="190" cy="86" r="5" />
    <circle cx="272" cy="158" r="4" />
    <circle cx="214" cy="226" r="5" />
    <circle cx="124" cy="214" r="3" />
    <circle cx="344" cy="206" r="3" />
  </g>

  <!-- 右下：数据网络（避开中央登录卡片区） -->
  <g class="net-line" stroke="rgba(54,207,201,0.18)" stroke-width="1.2" fill="none">
    <path d="M1030 540 L1136 486 L1240 560 L1176 656 L1030 540" />
    <path d="M1136 486 L1296 612 L1240 560" />
    <path d="M1176 656 L1100 712 L1006 636 L1030 540" />
    <path d="M1296 612 L1352 520 L1136 486" />
    <path d="M1100 712 L1222 740 L1296 612" />
  </g>
  <g class="net-dot" fill="rgba(54,207,201,0.30)">
    <circle cx="1030" cy="540" r="4" />
    <circle cx="1136" cy="486" r="5" />
    <circle cx="1240" cy="560" r="4" />
    <circle cx="1176" cy="656" r="5" />
    <circle cx="1296" cy="612" r="4" />
    <circle cx="1352" cy="520" r="3" />
    <circle cx="1100" cy="712" r="4" />
    <circle cx="1006" cy="636" r="3" />
    <circle cx="1222" cy="740" r="3" />
  </g>
</svg>
