[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pytorch-ocr"
version = "0.1.0"
description = "AIStation self-authored PyTorch OCR (PP-OCRv6 aligned det + rec) — standalone library packaged into the aistation-ocr Docker image."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "opencv-python-headless>=4.8.0",
    "pyclipper>=1.3.0",
    "numpy>=1.24",
    "pillow>=10.0.0",
]

[project.scripts]
pytorch-ocr = "pytorch_ocr.cli:main"

[tool.setuptools]
packages = ["pytorch_ocr"]

[tool.setuptools.package-data]
pytorch_ocr = ["utils/dict/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
