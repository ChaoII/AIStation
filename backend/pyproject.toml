[project]
name = "backend"
version = "2.0.0"
description = "aistation后端工程"
readme = "README.md"
requires-python = ">=3.10,<3.14"  # 上限 3.14：mcp>=2.1 在 3.14+ 要求 starlette>=0.48，与 fastapi==0.115.2 冲突
dependencies = [
    "agno==3.0.6",
    "aiofiles==24.1.0",                         # 文件操作
    "aiomqtt>=2.0,<3",                          # 边缘事件 MQTT 接入（懒加载，未安装/未启用时降级）
    "aiosqlite==0.17.0",                        # sqlite 异步操作数据库
    "alembic==1.15.1",                          # 数据库迁移
    "apscheduler==3.11.0",                      # 定时任务
    "boto3>=1.35.0",                            # AWS S3 / RustFS SDK
    "asyncmy==0.2.11",                           # mysql 异步操作数据库：基于 mysqlclient：asyncmy 是 mysqlclient 的异步版本，mysqlclient 是一个 C 语言编写的 MySQL 客户端，性能较高。性能：asyncmy 通常在性能上优于 aiomysql，特别是在高并发和大数据量的场景下。
    "asyncpg==0.30.0",                          # postgresql 异步操作数据库基于 psycopg2：asyncpg 是 psycopg2 的异步版本，psycopg2 是一个 pure-Python PostgreSQL 数据库适配器。性能：asyncpg 通常在性能上优于 psycopg2，特别是在高并发和大数据量的场景下。
    "bcrypt==4.0.1",                            # 密码加密解析,切勿升级，如果升级，请同时升级python版本
    "bleach==6.3.0",                            # 过滤 HTML 标签
    "click>=8.1.8,<8.2",                             # 命令行参数解析
    "croniter>=1.0.12,<5.0.0",                  # cron（与 prefect 约束一致；部署 requirements.txt 同源）
    "cryptography==45.0.2",                     # mysql8 密码加密                     # mysql8 密码加密
    "fastapi==0.115.2",                         # fastapi 框架
    "fastapi-limiter==0.1.6",                   # 接口限流
    "greenlet==3.1.1",                          # 协程框架
    "gunicorn==23.0.0",                         # 协程框架
    "httpx[http2]==0.28.1",                     # HTTP 客户端
    "itsdangerous==2.2.0",                      # 用于安全处理各种数据，如密码、密钥等
    "jinja2==3.1.6",                            # 模板引擎
    "loguru==0.7.3",                            # 日志
    "nvidia-ml-py==13.615.71",                  # NVML 绑定：读 GPU 型号/显存/利用率/驱动版本（提供 pynvml 模块）
    "openai==2.28.0",
    "openinference-instrumentation-agno>=1.0.15",  # Agno 追踪（OpenTelemetry 语义约定）
    "opentelemetry-sdk>=1.45.1",                # Agno 追踪落库（agno_traces/agno_spans）依赖
    "opencv-python-headless>=4.9.0",            # 视频智能分析 worker 视频帧处理
    "onnxruntime>=1.17.0",                       # 智能分析推理引擎
    "openpyxl==3.1.5",                          # Excel
    "pandas==2.2.3",                            # 数据处理
    "passlib==1.7.4",                           # 密码加密
    "prefect>=3.5.0,<4",                        # 工作流编排（与 typer>=0.19 兼容；部署与 requirements.txt 一致）
    "pillow==11.0.0",                           # 图片处理
    "psutil==6.1.0",                            # 系统信息
    "psycopg==3.3.2",                           # postgresql 同步操作数据库基于 psycopg是psycopg2升级版：psycopg2 是一个 pure-Python PostgreSQL 适配器。
    "psycopg-binary==3.3.2",                    # postgresql 异步操作数据库基于 psycopg2：asyncpg 是 psycopg2 的异步版本，psycopg2 是一个 pure-Python PostgreSQL 数据库适配器。
    "pydantic-settings==2.5.2",                 # 配置设置
    "pydantic-validation-decorator==0.1.4",     # 模型验证
    "pyjwt>=2.10.1,<3.0.0",                             # OAuth2
    "pymysql==1.1.2",                           # mysql 同步步操作数据库基于 pymysql：aiomysql 是 pymysql 的异步版本，pymysql 是一个纯 Python 实现的 MySQL 客户端。成熟度：aiomysql 相对较为成熟，社区支持较好，文档也比较完善。
    "python-multipart==0.0.9",                  # request.form() 对表单进行「解析」时安装
    "redis==7.1.0",                             # redis 同/异步操作数据库(用户celery配套使用)redis 异步操作数据库 redis已经完全具备了aioredis的功能，无需重复安全,且aioredis已经不再维护也不兼容3.10+的版本
    "rich==13.9.4",                             # 终端打印美化
    "tomli>=2.0.1; python_version < '3.11'",    # 解析 plugin.toml（3.11+ 用标准库 tomllib）
    "sqlalchemy==2.0.45",                       # 数据库ORM
    "sqlglot[rs]==27.8.0",                      # sql 解析
    "typer==0.19.0",                             # 命令行工具
    "user-agents==2.2.0",                       # 获取用户UA
    "uvicorn>=0.31.1",                          # uvicorn web 框架
    "websockets>=15.0.1,<16.0",                 # websocket（prefect>=3.5 需 >=15.0.1；与部署 requirements.txt 一致）
    "jieba>=0.42.1",
    "mcp>=2.1.0,<3.0.0",
    "ddgs>=9.16.0",
    "wikipedia>=1.4.0",
    "arxiv>=4.0.1",
    "duckdb>=1.5.6",
    "matplotlib>=3.10.9",
    "lxml_html_clean>=0.4.5",                   # newspaper4k 正文抽取所需（lxml 的 clean 子模块已拆出）
    "newspaper4k>=0.9.6",                       # 新闻正文抓取（替代停更的 newspaper3k：后者拖 jieba3k 覆盖真 jieba）
    "pgvector>=0.5.1",
    "pypdf>=6.20.1",
    "python-docx>=1.2.0",
    "py-spy>=0.4.2",
    "tiktoken>=0.14.0",
]

[project.optional-dependencies]
# 简单模式：把本地 submodule 里的 TorchKiln 作为本地依赖安装。
# ⚠️ 不能用 `torchkiln @ file://./submodules/torchkiln` 字符串形式：
# uv 0.11 的 PEP 508 解析不接受相对 file:// URL，会退化为构建根项目
# 元数据再失败（见 [tool.setuptools] 说明）。改用 uv 官方推荐的
# PEP 621 名字 + [tool.uv.sources] path 映射（锁文件记录为本地目录）。
simple = ["torchkiln"]

[dependency-groups]
dev = [
    "fakeredis>=2.21.0,<3",   # 测试：内存 Redis，配合 TESTING
    "pytest==9.0.2",
    # 测试并行：全量 1962 用例 367s → 225s（-n 4）；execnet 是其唯一传递依赖，
    # 这里显式列出以便 `pip -r`/离线安装（见 AGENTS.md「测试效率」）。
    "pytest-xdist==3.8.0",
    "execnet==2.1.2",
    "ruff==0.14.13",          # 代码检查/格式化
]

# uv 需要构建根项目元数据时（如 optional-dependencies 出现本地 file:// 依赖），
# setuptools flat-layout 会把 sql/static/submodules 误判为顶级包而报错；
# 显式声明只含 app（backend 本身是虚拟项目，不会真正打包安装）。
[tool.setuptools.packages.find]
include = ["app*"]

[tool.uv]
default-groups = ["dev"]     # 本地 uv sync 含 dev；生产 pip -r requirements.txt 不含 pytest/ruff/fakeredis

[tool.uv.sources]
# simple 可选依赖组引用的本地 TorchKiln（git submodule，钉在 TK_COMMIT）
torchkiln = { path = "submodules/torchkiln" }

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[tool.ruff]
line-length = 100
indent-width = 4
preview = true
fix = true
show-fixes = true
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
extend-include = ["*.pyw"]

[tool.ruff.lint]
select = [
    "FAST",
    "F",
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "W191",  # indentation contains tabs
    "B904",  # Within an `except` clause
    "B010",  # Do not call with a constant attribute value.
    "B009",  # Do not use getattr() with a constant attribute value.
    "E712",  # Avoid equality comparisons to `False`; use `not getattr(self.model, "is_deleted"):` for false checks
    "W293",  # blank line with whitespace
]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]  # 先设置 TESTING/SQLite 环境再 import 应用

[tool.ruff.format]
docstring-code-format = true
preview = true
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
